# Guardrail spec as described by the system's owner. Spec only: no hook code exists.
# status: active | proposed. G1-G8 are never removed or weakened.
# status: active = adopted in the design; enforced = a blocking hook exists.
# implemented = blocking hook code exists and passes the X1 hook layer (hooks/tests/run_x1.py); enforced = registered
# in settings.json and the X1 live layer passed. G1, G2, G6, G7, G8 are implemented, not yet enforced.
# enforced: false for every guardrail today (docs/baseline.md: all hooks are async loggers).
# proposed_mechanism fields and G9-G14 are proposed (report §9) and need human approval.
# Any future G1-G8 byte-identity check (G12) must baseline against commit 826985b or later:
# G1-G8 gained the proposed_mechanism and enforced fields in that commit, and G6's proposed_mechanism
# was extended (resolved real paths) in the final-review fix commit. Baseline against the newest of these.
# Live surfaces (report §9): after scripts/install.sh, ~/.claude/agents/, skills/ and agent-memory/advisor/
# are symlinks into this repo, so every path check must compare resolved real paths.
guardrails:
  - id: G1
    name: report contract check
    enforces: WORKER REPORT and ADVISOR GUIDANCE match their required fields
    status: active
    enforced: false
    protected: true
    proposed_mechanism: SubagentStop hook validates fields   # proposed (report §9)
    hook: [hooks/g1_report_contract.py]
    implemented: true
  - id: G2
    name: Orchestrator may not write files
    enforces: the Orchestrator makes no file edits
    status: active
    enforced: false
    protected: true
    proposed_mechanism: PreToolUse deny on Write/Edit for orchestrator agent_type; Bash via sandbox   # proposed (report §9)
    hook: [hooks/g2_orchestrator_nowrite.py]
    implemented: true
    residual: Bash writes by the Orchestrator; write-capable MCP tools are not covered (needs sandbox and a tool allowlist)
  - id: G3
    name: silent-failure detection
    enforces: failures that report success are caught
    status: active
    enforced: false
    protected: true
    proposed_mechanism: SubagentStop re-runs DONE_WHEN; WORKS + fail -> block   # proposed (report §9)
  - id: G4
    name: fresh evidence required
    enforces: VERIFICATION carries a command, result and ran_at from this run
    status: active
    enforced: false
    protected: true
    proposed_mechanism: SubagentStop checks ran_at within run   # proposed (report §9)
  - id: G5
    name: test-first acceptance gate
    enforces: the DONE_WHEN test must fail before the Worker starts
    status: active
    enforced: false
    protected: true
    proposed_mechanism: hook runs DONE_WHEN before first Worker dispatch; must fail   # proposed (report §9)
  - id: G6
    name: Advisor may write only to its memory folder
    enforces: Advisor Write and Edit calls are allowed only inside its memory folder (~/.claude/agent-memory/advisor/)
    status: active
    enforced: false
    protected: true
    proposed_mechanism: PreToolUse path check + sandbox write scope; compare resolved real paths, since ~/.claude/agent-memory/advisor/ and the repo's memory/advisor/ are aliases via install.sh symlinks   # proposed (report §9)
    hook: [hooks/g6_advisor_memory.py]
    implemented: true
    residual: Bash analysis is lexical (a path built at run time, a script file that writes, sed 'w FILE', npm install -g, make, base64 or another interpreter is not seen); write-capable MCP tools are not covered; needs sandbox write scope
  - id: G7
    name: Worker may write only inside the git root
    enforces: Worker writes stay inside the git root
    status: active
    enforced: false
    protected: true
    proposed_mechanism: PreToolUse path check + sandbox   # proposed (report §9)
    hook: [hooks/g7_worker_gitroot.py]
    implemented: true
    residual: Bash analysis is lexical (a path built at run time, a script file that writes, sed 'w FILE', npm install -g, make, base64 or another interpreter is not seen); a symlink created inside the repo after the check cannot be pre-empted; write-capable MCP tools are not covered; needs sandbox write scope
  - id: G8
    name: Worker may not edit the test files named in DONE_WHEN
    enforces: the acceptance test cannot be changed by the Worker
    status: active
    enforced: false
    protected: true
    proposed_mechanism: PreToolUse path check on Edit/Write/Bash   # proposed (report §9)
    hook: [hooks/g8_capture.py, hooks/g8_worker_tests.py]
    implemented: true
    residual: Bash analysis is lexical (a path built at run time by a script, base64, or another interpreter is not seen); hook state and event log are agent-writable except for the names the hook denies (needs sandbox and G13); Worker may add conftest.py/pytest.ini that patch the test (G14); MCP write tools (report Q-e)
  - id: G9
    name: No agent writes PROTECTED.paths
    enforces: no agent may write any path listed in PROTECTED.paths
    status: proposed
    enforced: false
    protected: true
    mechanism: PreToolUse path check for all agents on resolved real paths (repo and ~/.claude paths are symlink aliases); sandbox deny   # proposed (report §9)
  - id: G10
    name: Eval isolation
    enforces: each eval trial runs in a fresh worktree with a memory snapshot; heldout is unreadable outside the harness
    status: proposed
    enforced: false
    protected: true
    mechanism: harness enforces fresh worktree + memory snapshot per trial; managed-settings Read/Grep/Glob deny on evals/tasks/heldout/** and evals/graders/** for every agent session, plus sandbox read-deny for Bash (fallback - store heldout outside the repo; report §5)   # proposed (report §9)
  - id: G11
    name: Memory write provenance
    enforces: "outcome: worked is set only from a hook-verified task_outcome event"
    status: proposed
    enforced: false
    protected: true
    mechanism: "hook-verified task_outcome event is the only source for outcome: worked"   # proposed (report §9)
  - id: G12
    name: Proposal scope
    enforces: the proposer writes only to proposals/inbox/; each proposal touches one surface and no path in PROTECTED.paths; G1-G8 blocks stay byte-identical; changes to hooks/ or PROTECTED.paths come only from a human
    status: proposed
    enforced: false
    protected: true
    mechanism: scripts/check_proposal.py plus PreToolUse path check on the proposer   # proposed (report §9)
  - id: G13
    name: Audit-log integrity
    enforces: events are append-only and hash-chained; the logger lives outside agent-writable paths
    status: proposed
    enforced: false
    protected: true
    mechanism: hash-chained events; logger outside agent-writable paths   # proposed (report §9)
  - id: G14
    name: Test-tamper heuristics
    enforces: Worker diffs are flagged for skip markers, sys.exit, and conftest/operator patches
    status: proposed
    enforced: false
    protected: true
    mechanism: diff heuristics on Worker diffs   # proposed (report §9)
