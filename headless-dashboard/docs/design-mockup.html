<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orch-dashboard v2 · Standalone UI Design Mockup</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #06080b;
    color: #e6edf3;
    font: 12px/1.4 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    overflow: hidden;
  }
  .studio {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }
  .studio-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    flex-wrap: wrap;
    padding: 8px 14px;
    background: #0d1117;
    border-bottom: 1px solid #222b38;
  }
  .studio-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 12px;
  }
  .badge {
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(56, 189, 248, 0.14);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.35);
    font-size: 11px;
  }
  .vp-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .vp-btn {
    font: inherit;
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #2a3444;
    background: #141a23;
    color: #9ba6b4;
    cursor: pointer;
  }
  .vp-btn:hover { color: #e6edf3; border-color: #3c4b62; }
  .vp-btn.active {
    background: rgba(34, 197, 94, 0.14);
    color: #22c55e;
    border-color: rgba(34, 197, 94, 0.45);
    font-weight: 700;
  }
  .swatches {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #8b949e;
    font-size: 11px;
  }
  .sw {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    display: inline-block;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 18px;
    padding: 0;
    overflow: auto;
    background:
      radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.05), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(167, 139, 250, 0.05), transparent 40%),
      #06080b;
  }
  .stage.framed { padding: 18px; }
  .device {
    display: flex;
    flex-direction: column;
    min-height: 0;
    width: 100%;
    height: 100%;
  }
  .stage.framed .device {
    border: 1px solid #2a3444;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    background: #090c10;
  }
  .device-cap {
    display: none;
    padding: 6px 12px;
    background: #0f141b;
    border-bottom: 1px solid #222b38;
    color: #8b949e;
    font-size: 11px;
    justify-content: space-between;
  }
  .stage.framed .device-cap { display: flex; }
  iframe {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    border: 0;
    background: #090c10;
  }
  .hide { display: none !important; }
  @media (max-width: 760px) {
    .swatches { display: none; }
  }
</style>
</head>
<body>
<div class="studio">
  <div class="studio-bar">
    <div class="studio-title">
      <span style="color:#22c55e">$</span>
      <span>orch-dashboard</span>
      <span class="badge">Standalone HTML Mockup</span>
    </div>
    <div class="vp-group" id="vps">
      <button type="button" class="vp-btn active" data-mode="full">Full (100%)</button>
      <button type="button" class="vp-btn" data-mode="desktop">Desktop (1280px)</button>
      <button type="button" class="vp-btn" data-mode="tablet">Tablet (768px)</button>
      <button type="button" class="vp-btn" data-mode="mobile">Mobile (390px)</button>
      <button type="button" class="vp-btn" data-mode="compare">Split (Desktop + Mobile)</button>
    </div>
    <div class="swatches" title="Terminal Design Tokens">
      <span>Tokens:</span>
      <span class="sw" style="background:#38bdf8" title="Worker #38bdf8"></span>
      <span class="sw" style="background:#a78bfa" title="Advisor #a78bfa"></span>
      <span class="sw" style="background:#22c55e" title="Works #22c55e"></span>
      <span class="sw" style="background:#f59e0b" title="Warn #f59e0b"></span>
      <span class="sw" style="background:#f43f5e" title="Fail/Stuck #f43f5e"></span>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="device" id="dev-a">
      <div class="device-cap"><span id="cap-a">Desktop</span><span>@media interactive preview</span></div>
      <iframe id="frame-a" title="Dashboard Primary Preview"></iframe>
    </div>
    <div class="device hide" id="dev-b" style="width:390px;flex:0 0 390px;">
      <div class="device-cap"><span>Mobile · 390px</span><span>&lt;= 760px card layout</span></div>
      <iframe id="frame-b" title="Dashboard Mobile Preview"></iframe>
    </div>
  </div>
</div>
<script>
const MOCK_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>orch-dashboard · Terminal Agent Coding Console<\/title>\n<style>\n  :root {\n    --bg: #090c10;\n    --bg-grid: rgba(148, 163, 184, 0.05);\n    --panel: #0f141b;\n    --panel-2: #151c26;\n    --ink: #e6edf3;\n    --muted: #8b949e;\n    --line: #222b38;\n    --line-strong: #303d4f;\n    --orch: #94a3b8;\n    --worker: #38bdf8;\n    --advisor: #a78bfa;\n    --ok: #22c55e;\n    --bad: #f43f5e;\n    --warn: #f59e0b;\n    --run: #06b6d4;\n    --ok-bg: rgba(34, 197, 94, 0.14);\n    --bad-bg: rgba(244, 63, 94, 0.15);\n    --warn-bg: rgba(245, 158, 11, 0.16);\n    --run-bg: rgba(6, 182, 212, 0.16);\n    --adv-bg: rgba(167, 139, 250, 0.16);\n    --mut-bg: rgba(148, 163, 184, 0.12);\n    --shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 8px 24px rgba(0, 0, 0, 0.35);\n    --mono: ui-monospace, \"SF Mono\", \"JetBrains Mono\", Menlo, Monaco, Consolas, \"Liberation Mono\", monospace;\n    --sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Noto Sans Thai\", Roboto, sans-serif;\n  }\n\n  :root[data-theme=\"light\"] {\n    --bg: #f3f5f8;\n    --bg-grid: rgba(15, 23, 42, 0.04);\n    --panel: #ffffff;\n    --panel-2: #f8fafc;\n    --ink: #0f172a;\n    --muted: #64748b;\n    --line: #e2e8f0;\n    --line-strong: #cbd5e1;\n    --orch: #475569;\n    --worker: #0284c7;\n    --advisor: #7c3aed;\n    --ok: #16a34a;\n    --bad: #dc2626;\n    --warn: #d97706;\n    --run: #0891b2;\n    --ok-bg: #dcfce7;\n    --bad-bg: #fee2e2;\n    --warn-bg: #fef3c7;\n    --run-bg: #cffafe;\n    --adv-bg: #ede9fe;\n    --mut-bg: #f1f5f9;\n    --shadow: 0 1px 2px rgba(15, 23, 42, 0.05);\n  }\n\n  * { box-sizing: border-box; }\n  html { scroll-behavior: smooth; overflow-x: clip; }\n  body {\n    margin: 0;\n    overflow-x: clip;\n    background-color: var(--bg);\n    background-image:\n      linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),\n      linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);\n    background-size: 28px 28px;\n    color: var(--ink);\n    font: 14px/1.45 var(--sans);\n    -webkit-font-smoothing: antialiased;\n  }\n\n  .mono { font-family: var(--mono); }\n  .wrap { max-width: 1360px; margin: 0 auto; padding: 18px 24px 40px; }\n\n  /* Sticky terminal command bar */\n  .topbar {\n    position: sticky;\n    top: 0;\n    z-index: 20;\n    background: color-mix(in srgb, var(--bg) 88%, transparent);\n    backdrop-filter: blur(10px);\n    border-bottom: 1px solid var(--line);\n  }\n  .topbar-inner {\n    max-width: 1360px;\n    margin: 0 auto;\n    padding: 12px 24px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 12px 18px;\n    flex-wrap: wrap;\n  }\n  .brand { display: flex; flex-direction: column; gap: 3px; min-width: 0; }\n  .brand-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }\n  .prompt-prefix {\n    font-family: var(--mono);\n    font-size: 13px;\n    color: var(--ok);\n    font-weight: 700;\n  }\n  h1 {\n    font-family: var(--mono);\n    font-size: 16px;\n    font-weight: 700;\n    margin: 0;\n    letter-spacing: -0.02em;\n    color: var(--ink);\n  }\n  .ver-badge {\n    font-family: var(--mono);\n    font-size: 11px;\n    font-weight: 600;\n    padding: 1px 7px;\n    border-radius: 5px;\n    background: var(--mut-bg);\n    border: 1px solid var(--line-strong);\n    color: var(--muted);\n  }\n  .status-line {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    flex-wrap: wrap;\n    font-family: var(--mono);\n    font-size: 11.5px;\n    color: var(--muted);\n  }\n  .dot {\n    width: 8px;\n    height: 8px;\n    border-radius: 50%;\n    background: var(--ok);\n    display: inline-block;\n    margin-right: 5px;\n    box-shadow: 0 0 8px var(--ok);\n  }\n  .dot.live { animation: pulse 2s infinite; }\n  .dot.stale { background: var(--bad); box-shadow: 0 0 8px var(--bad); animation: none; }\n  .dot.paused { background: var(--warn); box-shadow: none; animation: none; }\n  @keyframes pulse {\n    0%, 100% { opacity: 1; }\n    50% { opacity: 0.45; }\n  }\n\n  .controls {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    flex-wrap: wrap;\n  }\n  .ctrl-group {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 7px;\n    padding: 4px 8px;\n    font-family: var(--mono);\n    font-size: 12px;\n    color: var(--muted);\n  }\n  .ctrl-group select {\n    font: inherit;\n    color: var(--ink);\n    background: transparent;\n    border: none;\n    outline: none;\n    cursor: pointer;\n    max-width: 160px;\n  }\n  .ctrl-group select option { background: var(--panel); color: var(--ink); }\n  .btn {\n    font-family: var(--mono);\n    font-size: 12px;\n    font-weight: 600;\n    color: var(--ink);\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 7px;\n    padding: 6px 10px;\n    cursor: pointer;\n    display: inline-flex;\n    align-items: center;\n    gap: 5px;\n    transition: border-color .15s, background .15s;\n  }\n  .btn:hover { border-color: var(--line-strong); background: var(--panel-2); }\n  .btn:focus-visible, select:focus-visible, input:focus-visible {\n    outline: 2px solid var(--worker);\n    outline-offset: 1px;\n  }\n  .btn.active { border-color: var(--worker); color: var(--worker); }\n\n  /* Quick section nav */\n  .subnav {\n    display: flex;\n    gap: 6px;\n    overflow-x: auto;\n    scrollbar-width: none;\n    padding: 4px 0 14px;\n    margin-bottom: 4px;\n  }\n  .subnav::-webkit-scrollbar { display: none; }\n  .nav-pill {\n    flex: 0 0 auto;\n    text-decoration: none;\n    font-family: var(--mono);\n    font-size: 11.5px;\n    color: var(--muted);\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 999px;\n    padding: 4px 10px;\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    transition: color .15s, border-color .15s;\n  }\n  .nav-pill:hover { color: var(--ink); border-color: var(--line-strong); }\n  .nav-count {\n    font-size: 10.5px;\n    padding: 0 5px;\n    border-radius: 999px;\n    background: var(--mut-bg);\n    color: var(--ink);\n  }\n  .nav-count.warn { background: var(--bad-bg); color: var(--bad); }\n\n  /* Section headings */\n  .sec-head {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 12px;\n    flex-wrap: wrap;\n    margin: 24px 0 10px;\n    scroll-margin-top: 84px;\n  }\n  h2 {\n    font-family: var(--mono);\n    font-size: 12px;\n    text-transform: uppercase;\n    letter-spacing: .08em;\n    color: var(--muted);\n    margin: 0;\n    font-weight: 700;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n  }\n  h2::before {\n    content: \">\";\n    color: var(--worker);\n    font-weight: 700;\n  }\n\n  .panel {\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 10px;\n    box-shadow: var(--shadow);\n    min-width: 0;\n  }\n\n  /* Grids */\n  .kpis {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr));\n    gap: 10px;\n  }\n  .kpi { padding: 13px 15px; display: flex; flex-direction: column; justify-content: space-between; }\n  .kpi .label {\n    font-family: var(--mono);\n    color: var(--muted);\n    font-size: 11px;\n    text-transform: uppercase;\n    letter-spacing: .04em;\n  }\n  .kpi .val {\n    font-family: var(--mono);\n    font-size: 24px;\n    font-weight: 700;\n    letter-spacing: -0.02em;\n    margin-top: 4px;\n    font-variant-numeric: tabular-nums;\n  }\n  .kpi .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }\n  .kpi.hero { grid-column: span 1; }\n  @media (min-width: 560px) {\n    .kpi.hero { grid-column: span 2; }\n  }\n  @media (min-width: 640px) {\n    #kpis-perf { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  }\n  @media (min-width: 1024px) {\n    #kpis-perf { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n  }\n\n  .bar {\n    height: 7px;\n    border-radius: 999px;\n    background: var(--mut-bg);\n    overflow: hidden;\n    display: flex;\n    margin-top: 10px;\n    border: 1px solid var(--line);\n  }\n  .bar > span { display: block; height: 100%; }\n\n  /* Agent telemetry cards */\n  .agents {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));\n    gap: 12px;\n  }\n  .two-col {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));\n    gap: 12px;\n    margin-top: 12px;\n  }\n  .agent { padding: 15px; border-top: 3px solid var(--c); }\n  .agent .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }\n  .agent .name {\n    font-family: var(--mono);\n    font-weight: 700;\n    font-size: 14px;\n    text-transform: uppercase;\n    letter-spacing: .04em;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n  }\n  .role-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--c); display: inline-block; }\n  .agent dl { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 14px; margin: 13px 0 0; }\n  .agent dt { color: var(--muted); font-size: 11.5px; }\n  .agent dd {\n    margin: 1px 0 0;\n    font-family: var(--mono);\n    font-size: 13px;\n    font-weight: 600;\n    font-variant-numeric: tabular-nums;\n  }\n\n  /* Status pills */\n  .pill {\n    display: inline-flex;\n    align-items: center;\n    gap: 4px;\n    padding: 2px 8px;\n    border-radius: 999px;\n    font-family: var(--mono);\n    font-size: 11px;\n    font-weight: 600;\n    white-space: nowrap;\n    border: 1px solid transparent;\n  }\n  .p-done, .p-WORKS { background: var(--ok-bg); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }\n  .p-stuck, .p-DOES_NOT_WORK, .p-ERROR, .p-failing { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }\n  .p-BLOCKED, .p-retry_pending, .p-NO_REPORT { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }\n  .p-in_progress, .p-RUNNING, .p-busy { background: var(--run-bg); color: var(--run); border-color: color-mix(in srgb, var(--run) 35%, transparent); }\n  .p-consulting, .p-GUIDANCE { background: var(--adv-bg); color: var(--advisor); border-color: color-mix(in srgb, var(--advisor) 30%, transparent); }\n  .p-idle, .p-queued, .p-pending { background: var(--mut-bg); color: var(--muted); border-color: var(--line); }\n\n  /* Guardrails & rounds */\n  .gbars {\n    padding: 14px 16px;\n    display: grid;\n    grid-template-columns: 38px 1fr 38px;\n    gap: 7px 10px;\n    align-items: center;\n    font-family: var(--mono);\n    font-size: 12px;\n  }\n  .gbars .track { height: 10px; background: var(--mut-bg); border-radius: 4px; overflow: hidden; }\n  .gbars .fill { height: 100%; background: var(--worker); border-radius: 0 4px 4px 0; }\n  .gbars .crit .fill { background: var(--bad); }\n  .note { color: var(--muted); font-size: 12px; padding: 0 16px 13px; }\n  .warn-n { color: var(--warn); font-size: 11px; font-weight: 600; }\n\n  /* Trends */\n  .trends {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));\n    gap: 10px;\n  }\n  .trend { padding: 12px 14px 8px; }\n  .trend .label {\n    color: var(--muted);\n    font-size: 11.5px;\n    display: flex;\n    justify-content: space-between;\n    gap: 6px;\n  }\n  .trend .val {\n    font-family: var(--mono);\n    font-size: 18px;\n    font-weight: 700;\n    font-variant-numeric: tabular-nums;\n    margin-top: 2px;\n  }\n  .trend svg { display: block; margin-top: 4px; }\n  .trend svg text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }\n\n  /* Timeline */\n  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: t  \"project\": null, \"alerts\": [{\"rule_id\": \"task_stuck\", \"severity\": \"high\", \"project\": \"mobile-app\", \"task_id\": \"T2\", \"status\": \"firing\", \"last_seen\": 1795464000.0, \"send_count\": 0, \"held\": 1}, {\"rule_id\": \"task_stuck\", \"severity\": \"high\", \"project\": \"data-pipeline\", \"task_id\": \"T2\", \"status\": \"firing\", \"last_seen\": 1795464000.0, \"send_count\": 0, \"held\": 1}, {\"rule_id\": \"task_stuck\", \"severity\": \"high\", \"project\": \"shop-api\", \"task_id\": \"T2\", \"status\": \"firing\", \"last_seen\": 1795464000.0, \"send_count\": 0, \"held\": 1}, {\"rule_id\": \"task_stuck\", \"severity\": \"high\", \"project\": \"shop-api\", \"task_id\": \"T3\", \"status\": \"firing\", \"last_seen\": 1795464000.0, \"send_count\": 0, \"held\": 1}, {\"rule_id\": \"guardrail_g3_g8\", \"severity\": \"critical\", \"project\": \"shop-api\", \"task_id\": \"T4\", \"status\": \"firing\", \"last_seen\": 1795464000.0, \"send_count\": 0, \"held\": 1}, {\"rule_id\": \"guardrail_g3_g8\", \"severity\": \"critical\", \"project\": \"shop-api\", \"task_id\": \"T3\", \"status\": \"firing\", \"last_seen\": 1795464000.0, \"send_count\": 0, \"held\": 1}]};<\/script>\n\n<script>\nconst REFRESH_MS = 3000;\nconst $ = (id) => document.getElementById(id);\nconst esc = (s) => String(s ?? \"\").replace(/[&<>\"]/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst fmtDur = (s) => {\n  if (s == null) return \"—\";\n  s = Math.round(s);\n  if (s < 60) return s + \"s\";\n  if (s < 3600) return Math.floor(s / 60) + \"m \" + (s % 60) + \"s\";\n  return Math.floor(s / 3600) + \"h \" + Math.floor((s % 3600) / 60) + \"m\";\n};\nconst fmtNum = (n) => n == null ? \"—\" : n >= 1e6 ? (n / 1e6).toFixed(2) + \"M\" : n >= 1e3 ? (n / 1e3).toFixed(1) + \"k\" : String(n);\nconst fmtPct = (p) => p == null ? \"—\" : p + \"%\";\nconst fmtTime = (ts) => new Date(ts * 1000).toLocaleTimeString([], {hour: \"2-digit\", minute: \"2-digit\"});\nconst AGENT_COLOR = { orchestrator: \"var(--orch)\", worker: \"var(--worker)\", advisor: \"var(--advisor)\" };\nconst STATUS_COLOR = { WORKS: \"var(--ok)\", DOES_NOT_WORK: \"var(--bad)\", ERROR: \"var(--bad)\", BLOCKED: \"var(--warn)\",\n  NO_REPORT: \"var(--warn)\", GUIDANCE: \"var(--advisor)\", RUNNING: \"var(--run)\", DONE: \"var(--orch)\" };\nconst STATE_LABEL = { done: \"Done\", in_progress: \"In progress\", failing: \"Failing\", stuck: \"Stuck — needs you\",\n  consulting: \"Asking advisor\", retry_pending: \"Retry pending\", queued: \"Queued\" };\n\nlet SPEC = null;\nlet LAST_DATA = null;\nlet TASK_FILTER = \"all\";\nlet TASK_QUERY = \"\";\nlet EXPANDED_KEYS = new Set();\nlet PAUSED = false;\n\n/* Theme init */\n(function initTheme() {\n  let saved = null;\n  try { saved = localStorage.getItem(\"agentdash_theme\"); } catch (_) {}\n  const prefersLight = window.matchMedia && window.matchMedia(\"(prefers-color-scheme: light)\").matches;\n  const theme = saved || (prefersLight ? \"light\" : \"dark\");\n  applyTheme(theme);\n})();\n\nfunction applyTheme(theme) {\n  document.documentElement.setAttribute(\"data-theme\", theme);\n  $(\"theme-btn\").textContent = theme === \"dark\" ? \"Light\" : \"Dark\";\n  try { localStorage.setItem(\"agentdash_theme\", theme); } catch (_) {}\n}\n$(\"theme-btn\").addEventListener(\"click\", () => {\n  const cur = document.documentElement.getAttribute(\"data-theme\") || \"dark\";\n  applyTheme(cur === \"dark\" ? \"light\" : \"dark\");\n});\n\nfunction kpi(label, val, sub = \"\", extra = \"\", cls = \"\") {\n  return `<div class=\"panel kpi ${cls}\"><div class=\"label\">${label}<\/div><div class=\"val\">${val}<\/div>\n    ${sub ? `<div class=\"sub\">${sub}<\/div>` : \"\"}${extra}<\/div>`;\n}\n\nfunction renderProgress(s) {\n  const p = s.progress, st = p.by_state || {};\n  const total = p.planned_total || p.tasks_total || 0;\n  const seg = (n, c) => total ? `<span style=\"width:${100 * n / total}%;background:${c}\"><\/span>` : \"\";\n  const active = (st.in_progress || 0) + (st.consulting || 0) + (st.retry_pending || 0) + (st.failing || 0);\n  const bar = `<div class=\"bar\">${seg(st.done || 0, \"var(--ok)\")}${seg(active, \"var(--run)\")}${seg(st.stuck || 0, \"var(--bad)\")}<\/div>`;\n  const doneCount = p.planned_total ? p.planned_done : (st.done || 0);\n  $(\"kpis-progress\").innerHTML =\n    kpi(\"Overall progress\", fmtPct(p.pct), `${doneCount} of ${total} tasks done`, bar, \"hero\") +\n    kpi(\"Done\", st.done || 0) +\n    kpi(\"Active\", active, \"running, retrying or with advisor\") +\n    kpi(\"Stuck\", st.stuck || 0, \"advisor limit reached\") +\n    kpi(\"Not started\", Math.max(0, total - p.tasks_total), p.planned_total ? \"in the plan, not dispatched\" : \"no plan logged\");\n  $(\"nav-done\").textContent = `${doneCount}/${total}`;\n  $(\"nav-active\").textContent = active;\n}\n\nfunction renderAgents(s) {\n  const elapsed = Math.max(1, s.generated_at - s.since);\n  $(\"agents\").innerHTML = Object.entries(s.agents).map(([name, a]) => {\n    const busy = a.running > 0;\n    const util = name === \"orchestrator\" ? null : Math.min(100, a.utilization_pct ?? 100 * a.busy_sec / elapsed);\n    const rows = name === \"orchestrator\"\n      ? [[\"Tool calls\", fmtNum(a.tool_calls)], [\"Tool failures\", a.tool_failures],\n         [\"Dispatched to worker\", s.agents.worker?.dispatches ?? 0], [\"Escalated to advisor\", s.agents.advisor?.dispatches ?? 0]]\n      : [[\"Dispatches\", a.dispatches], [\"Busy time\", fmtDur(a.busy_sec)],\n         [\"Avg / p90 per run\", `${fmtDur(a.avg_sec)} / ${fmtDur(a.p90_sec)}`], [\"Tool calls (fails)\", `${fmtNum(a.tool_calls)} (${a.tool_failures})`],\n         [\"Tokens\", fmtNum(a.tokens)],\n         name === \"worker\" ? [\"Works / fails\", `${a.works ?? 0} / ${a.fails ?? 0}`] : [\"Utilization\", fmtPct(util?.toFixed(0))]];\n    const utilBar = util == null ? \"\" :\n      `<div class=\"bar\" title=\"Utilization ${util.toFixed(0)}%\"><span style=\"width:${util}%;background:${AGENT_COLOR[name] || \"var(--orch)\"}\"><\/span><\/div>`;\n    return `<div class=\"panel agent\" style=\"--c:${AGENT_COLOR[name] || \"var(--orch)\"}\">\n      <div class=\"top\"><span class=\"name\"><span class=\"role-dot\"><\/span>${esc(name)}<\/span>\n        <span class=\"pill p-${busy ? \"busy\" : \"idle\"}\">${busy ? a.running + \" running\" : \"idle\"}<\/span><\/div>\n      ${utilBar}\n      <dl>${rows.map(([k, v]) => `<div><dt>${k}<\/dt><dd>${v}<\/dd><\/div>`).join(\"\")}<\/dl><\/div>`;\n  }).join(\"\");\n}\n\nfunction renderPerf(s) {\n  const p = s.performance;\n  $(\"kpis-perf\").innerHTML =\n    kpi(\"First-try success\", fmtPct(p.first_try_success_pct), \"worker solved it without advisor\") +\n    kpi(\"Escalation rate\", fmtPct(p.escalation_pct), \"tasks that needed the advisor\") +\n    kpi(\"Advisor fix rate\", fmtPct(p.advisor_fix_pct), \"escalated tasks later done\") +\n    kpi(\"Worker success\", fmtPct(p.worker_success_pct), \"per worker run\") +\n    kpi(\"Avg time per task\", fmtDur(p.avg_task_sec), \"first dispatch → works\") +\n    kpi(\"Throughput\", p.throughput_per_hour, \"tasks done / hour\") +\n    kpi(\"Tokens\", fmtNum(p.total_tokens), \"subagents\") +\n    kpi(\"Cost\", p.cost_usd ? \"$\" + p.cost_usd.toFixed(2) : \"—\", \"OTel, else headless runs\");\n}\n\nfunction renderTimeline(s) {\n  const items = s.timeline;\n  if (!items.length) { $(\"timeline\").innerHTML = `<div class=\"empty\">No dispatches yet.<\/div>`; return; }\n  const lanes = [\"worker\", \"advisor\", ...new Set(items.map(i => i.agent).filter(a => a !== \"worker\" && a !== \"advisor\"))];\n  const t0 = Math.min(...items.map(i => i.start)), t1 = Math.max(s.generated_at, ...items.map(i => i.end || 0));\n  const avail = $(\"timeline\").clientWidth - 32;\n  const W = Math.max(avail, 560), L = 76, laneH = 34, top = 6;\n  const x = (t) => L + (W - L - 10) * (t - t0) / Math.max(1, t1 - t0);\n  const H = top + lanes.length * laneH + 22;\n  let svg = `<svg width=\"${W}\" height=\"${H}\" role=\"img\" aria-label=\"Dispatch timeline\">`;\n  lanes.forEach((ln, i) => {\n    const y = top + i * laneH;\n    svg += `<text x=\"0\" y=\"${y + laneH / 2 + 4}\" style=\"fill:${AGENT_COLOR[ln] || \"var(--muted)\"};font-weight:700;text-transform:uppercase\">${esc(ln)}<\/text>`;\n    svg += `<line x1=\"${L}\" x2=\"${W}\" y1=\"${y + laneH}\" y2=\"${y + laneH}\" stroke=\"var(--line)\"/>`;\n  });\n  const ticks = avail < 520 ? 4 : 6;\n  for (let k = 0; k <= ticks; k++) {\n    const t = t0 + (t1 - t0) * k / ticks;\n    const lab = (t1 - t0) > 86400 ? new Date(t * 1000).toLocaleDateString([], {month: \"short\", day: \"numeric\"}) + \" \" + fmtTime(t) : fmtTime(t);\n    svg += `<text x=\"${x(t)}\" y=\"${H - 4}\" text-anchor=\"${k === 0 ? \"start\" : k === ticks ? \"end\" : \"middle\"}\">${lab}<\/text>`;\n  }\n  items.forEach(it => {\n    const y = top + lanes.indexOf(it.agent) * laneH + 7;\n    const x0 = x(it.start), x1 = x(it.end || s.generated_at);\n    const w = Math.max(4, x1 - x0);\n    const tip = `${it.project ? it.project + \" \" : \"\"}${it.task} · ${it.agent} · ${it.status} · ${fmtDur((it.end || s.generated_at) - it.start)}\\n${it.description || \"\"}`;\n    svg += `<rect x=\"${x0}\" y=\"${y}\" width=\"${w}\" height=\"${laneH - 14}\" rx=\"3\" fill=\"${STATUS_COLOR[it.status] || \"var(--orch)\"}\"\n      opacity=\"${it.status === \"RUNNING\" ? 0.6 : 0.92}\"><title>${esc(tip)}<\/title><\/rect>`;\n    if (w > 34) svg += `<text x=\"${x0 + 5}\" y=\"${y + (laneH - 14) / 2 + 4}\" style=\"fill:#fff;font-weight:700;pointer-events:none\">${esc(it.task)}<\/text>`;\n  });\n  $(\"timeline\").innerHTML = svg + \"<\/svg>\";\n}\n\nfunction isActiveState(st) {\n  return st === \"in_progress\" || st === \"consulting\" || st === \"retry_pending\" || st === \"failing\";\n}\n\nfunction renderTasks(s) {\n  const dispatched = new Set(s.tasks.map(t => t.task));\n  const notStartedList = s.plan.filter(p => {\n    const m = /\\[\\s*([A-Za-z]+-?\\d+)\\s*\\]/.exec(p.subject || \"\");\n    return !(m && dispatched.has(m[1].toUpperCase())) && !/complet|done/i.test(p.status || \"\");\n  });\n  $(\"nav-tasks\").textContent = s.tasks.length + notStartedList.length;\n\n  if (!s.tasks.length && !notStartedList.length) {\n    $(\"tasks\").innerHTML = `<div class=\"empty\">No tasks yet. Start the orchestrator with <code>orch<\/code> and it will tag each task like <code>[T1] …<\/code>.<\/div>`;\n    return;\n  }\n\n  const q = TASK_QUERY.trim().toLowerCase();\n  const matchQuery = (t) => !q || `${t.task} ${t.project || \"\"} ${t.title || \"\"}`.toLowerCase().includes(q);\n  const matchFilter = (t) => {\n    if (TASK_FILTER === \"all\") return true;\n    if (TASK_FILTER === \"active\") return isActiveState(t.state);\n    if (TASK_FILTER === \"queued\") return false;\n    return t.state === TASK_FILTER;\n  };\n\n  const chip = (h) => {\n    const label = h.agent === \"advisor\" ? \"A\" : h.status === \"WORKS\" ? \"✓\" : h.status === \"RUNNING\" ? \"…\" : \"✗\";\n    return `<span class=\"chip p-${h.status}\" title=\"${esc(h.agent + \": \" + h.status)}\">${label}<\/span>`;\n  };\n\n  const filtered = s.tasks.slice().reverse().filter(t => matchFilter(t) && matchQuery(t));\n  const rows = filtered.map(t => {\n    const rowKey = t.key || `${t.project || \"\"}/${t.task}`;\n    const open = EXPANDED_KEYS.has(rowKey);\n    const cmd = `orch-dashboard --json${t.project ? \" --project \" + t.project : \"\"} --task ${t.task}`;\n    const mainRow = `<tr class=\"task-row\" data-key=\"${esc(rowKey)}\" tabindex=\"0\" aria-expanded=\"${open}\">\n      <td data-label=\"ID\"><b class=\"mono\">${esc(t.task)}<\/b>${t.project ? `<div class=\"mono\" style=\"color:var(--muted);font-size:11px\">${esc(t.project)}<\/div>` : \"\"}<\/td>\n      <td data-label=\"Task\" class=\"title-cell\" title=\"${esc(t.title)}\">${esc(t.title.replace(/^\\s*\\[[^\\]]+\\]\\s*/, \"\"))}<\/td>\n      <td data-label=\"State\"><span class=\"pill p-${t.state}\">${STATE_LABEL[t.state] || t.state}<\/span><\/td>\n      <td data-label=\"Worker runs\" class=\"num\">${t.worker_runs}<\/td>\n      <td data-label=\"Advisor rounds\" class=\"num\">${t.advisor_rounds}<\/td>\n      <td data-label=\"First try\" class=\"mono\">${t.first_try == null ? \"—\" : t.first_try ? \"Yes\" : \"No\"}<\/td>\n      <td data-label=\"Elapsed\" class=\"num\">${fmtDur((t.end || s.generated_at) - t.start)}<\/td>\n      <td data-label=\"History\"><div class=\"chips\">${t.history.map(chip).join(\"\")}<\/div><\/td>\n    <\/tr>`;\n    if (!open) return mainRow;\n    const trace = t.history.map((h, idx) => `<span class=\"trace-step\">\n      <span style=\"color:var(--muted)\">#${idx + 1}<\/span>\n      <strong style=\"color:${AGENT_COLOR[h.agent] || \"var(--ink)\"}\">${esc(h.agent)}<\/strong>\n      <span class=\"pill p-${h.status}\">${esc(h.status)}<\/span>\n      ${h.from_memory === \"hit\" ? `<span class=\"pill p-GUIDANCE\">mem:hit<\/span>` : \"\"}\n    <\/span>`).join(\"\");\n    return mainRow + `<tr class=\"task-detail-row\"><td colspan=\"8\">\n      <div class=\"trace-box\">\n        <div class=\"trace-steps\">${trace || '<span class=\"muted\">No dispatch steps recorded<\/span>'}<\/div>\n        <div class=\"cli-cmd\">\n          <span>$ ${esc(cmd)}<\/span>\n          <button type=\"button\" class=\"copy-btn\" data-copy=\"${esc(cmd)}\">Copy CLI<\/button>\n        <\/div>\n      <\/div>\n    <\/td><\/tr>`;\n  }).join(\"\");\n\n  const showPlan = TASK_FILTER === \"all\" || TASK_FILTER === \"queued\";\n  const notStarted = showPlan ? notStartedList.filter(p => !q || (p.subject || \"\").toLowerCase().includes(q)).map(p => `<tr>\n    <td data-label=\"ID\" class=\"mono\">—<\/td>\n    <td data-label=\"Task\" class=\"title-cell\">${esc(p.subject)}<\/td>\n    <td data-label=\"State\"><span class=\"pill p-queued\">Not started<\/span><\/td>\n    <td data-label=\"Worker runs\" class=\"num\">—<\/td>\n    <td data-label=\"Advisor rounds\" class=\"num\">—<\/td>\n    <td data-label=\"First try\">—<\/td>\n    <td data-label=\"Elapsed\" class=\"num\">—<\/td>\n    <td data-label=\"History\">—<\/td>\n  <\/tr>`).join(\"\") : \"\";\n\n  if (!rows && !notStarted) {\n    $(\"tasks\").innerHTML = `<div class=\"empty\">No tasks match the current filter.<\/div>`;\n    return;\n  }\n\n  $(\"tasks\").innerHTML = `<table class=\"resp\"><thead><tr><th>ID<\/th><th>Task<\/th><th>State<\/th><th>Worker<\/th>\n    <th>Advisor<\/th><th>First try<\/th><th>Elapsed<\/th><th>History<\/th><\/tr><\/thead><tbody>${rows}${notStarted}<\/tbody><\/table>`;\n}\n\nfunction renderRuns(s) {\n  const runs = s.runs.filter(r => r.kind !== \"start\");\n  $(\"nav-runs\").textContent = runs.length;\n  if (!runs.length) { $(\"runs\").innerHTML = `<div class=\"empty\">No headless runs yet. Use <code>orch-headless \"your task\"<\/code>.<\/div>`; return; }\n  $(\"runs\").innerHTML = `<table class=\"resp\"><thead><tr><th>Started<\/th><th>Prompt<\/th><th>Result<\/th><th>Turns<\/th><th>Duration<\/th><th>Cost<\/th><\/tr><\/thead><tbody>\n    ${runs.slice().reverse().map(r => `<tr>\n      <td data-label=\"Started\" class=\"mono\">${fmtTime(r.ts - (r.duration_ms || 0) / 1000)}<\/td>\n      <td data-label=\"Prompt\" class=\"title-cell\" title=\"${esc(r.prompt || r.run_id || \"\")}\">${esc(r.prompt || r.run_id || r.project || \"\")}<\/td>\n      <td data-label=\"Result\"><span class=\"pill p-${r.is_error ? \"ERROR\" : \"WORKS\"}\">${r.is_error ? \"Error\" : \"OK\"}<\/span><\/td>\n      <td data-label=\"Turns\" class=\"num\">${r.num_turns ?? \"—\"}<\/td>\n      <td data-label=\"Duration\" class=\"num\">${fmtDur((r.duration_ms || 0) / 1000)}<\/td>\n      <td data-label=\"Cost\" class=\"num\">${r.cost_usd != null ? \"$\" + r.cost_usd.toFixed(2) : \"—\"}<\/td>\n    <\/tr>`).join(\"\")}<\/tbody><\/table>`;\n}\n\nconst fmtMetric = (m) => {\n  if (!m || m.value == null) return \"—\";\n  const v = m.unit === \"%\" ? m.value.toFixed(1) + \"%\" : m.unit === \"USD\" ? \"$\" + m.value.toFixed(2) : m.unit === \"s\" ? fmtDur(m.value) : String(m.value);\n  return m.sufficient ? v : `${v} <span class=\"warn-n\" title=\"n=${m.n} below minimum ${m.min_sample}\">⚠︎ n=${m.n}<\/span>`;\n};\n\nfunction renderQuality(v) {\n  const m = v.metrics;\n  $(\"kpis-quality\").innerHTML =\n    kpi(\"Fake-WORKS rate\", fmtMetric(m.fake_works_pct), \"WORKS reports flagged by G3/G4/G8\") +\n    kpi(\"Guardrail hits / task\", fmtMetric(m.guardrail_hits_per_task), `${v.guardrails.total} hits · ${v.guardrails.unattributed} unattributed`) +\n    kpi(\"Memory hit rate\", fmtMetric(m.memory_hit_pct), \"advisor FROM MEMORY ≠ none\") +\n    kpi(\"Memory-assisted success\", fmtMetric(m.memory_assisted_success_pct), \"tasks with a memory hit, done\") +\n    kpi(\"Cost per solved task\", fmtMetric(m.cost_per_solved_task_usd), Object.keys(v.cost_sources || {}).join(\" + \") || \"no cost data\") +\n    kpi(\"Tool failure rate\", fmtMetric(m.tool_failure_pct), \"non-Agent tool calls\");\n  const gs = Object.entries(v.guardrails.by_guardrail);\n  const gmax = Math.max(1, ...gs.map(([, x]) => x.hits));\n  $(\"gbars\").innerHTML = gs.map(([g, x]) => `<b>${esc(g)}<\/b><div class=\"track ${[\"G3\",\"G4\",\"G8\"].includes(g) ? \"crit\" : \"\"}\" title=\"${esc(g)}: ${x.hits} hit(s), ${x.per_task ?? \"—\"} per task\"><div class=\"fill\" style=\"width:${100 * x.hits / gmax}%\"><\/div><\/div><span class=\"num\">${x.hits}<\/span>`).join(\"\");\n  const rd = Object.entries(v.advisor_rounds_distribution);\n  const rmax = Math.max(1, ...rd.map(([, n]) => n));\n  $(\"rounds\").innerHTML = rd.map(([k, n]) => `<b>${k}<\/b><div class=\"track\" title=\"${n} task(s) with ${k} advisor round(s)\"><div class=\"fill\" style=\"width:${100 * n / rmax}%;background:var(--advisor)\"><\/div><\/div><span class=\"num\">${n}<\/span>`).join(\"\");\n  if (v.active_runs && v.active_runs.length) {\n    $(\"banner\").style.display = \"block\";\n    $(\"banner\").textContent = `${v.active_runs.length} headless run(s) active: ` + v.active_runs.map(r => (r.project || \"default\") + \" \" + r.run_id).join(\", \");\n  } else if (!SNAP) { $(\"banner\").style.display = \"none\"; }\n}\n\nconst TREND_METRICS = [\"tasks_done\", \"first_try_success_pct\", \"advisor_fix_pct\", \"fake_works_pct\",\n  \"memory_hit_pct\", \"guardrail_hits_per_task\", \"cost_per_solved_task_usd\", \"worker_success_pct\"];\nfunction spark(series, unit) {\n  const W = 220, H = 64, P = 6;\n  const pts = series.filter(p => p.value != null);\n  if (pts.length < 1) return `<div class=\"note\" style=\"padding:8px 0\">no data yet<\/div>`;\n  const vals = pts.map(p => p.value), lo = Math.min(0, ...vals), hi = Math.max(...vals, unit === \"%\" ? 100 : 1e-9);\n  const x = (i) => P + (W - 2 * P) * (series.length === 1 ? 0.5 : i / (series.length - 1));\n  const y = (v) => H - 14 - (H - 22) * (v - lo) / Math.max(1e-9, hi - lo);\n  let path = \"\", dots = \"\";\n  series.forEach((p, i) => {\n    if (p.value == null) return;\n    path += (path ? \"L\" : \"M\") + x(i).toFixed(1) + \",\" + y(p.value).toFixed(1);\n    const lab = (unit === \"%\" ? p.value.toFixed(1) + \"%\" : unit === \"USD\" ? \"$\" + p.value.toFixed(2) : p.value) + (p.sufficient === false ? ` (n=${p.n}, below min)` : \"\");\n    dots += `<circle cx=\"${x(i)}\" cy=\"${y(p.value)}\" r=\"${p.sufficient === false ? 3 : 4}\" fill=\"${p.sufficient === false ? \"var(--panel)\" : \"var(--worker)\"}\" stroke=\"var(--worker)\" stroke-width=\"2\"><title>${esc(p.week)}: ${esc(lab)}<\/title><\/circle>`;\n    dots += `<rect x=\"${x(i) - 12}\" y=\"0\" width=\"24\" height=\"${H}\" fill=\"transparent\"><title>${esc(p.week)}: ${esc(lab)}<\/title><\/rect>`;\n  });\n  const first = series[0].week, last = series[series.length - 1].week;\n  return `<svg width=\"100%\" viewBox=\"0 0 ${W} ${H}\" role=\"img\" aria-label=\"weekly trend\">\n    <line x1=\"${P}\" x2=\"${W - P}\" y1=\"${H - 14}\" y2=\"${H - 14}\" stroke=\"var(--line)\"/>\n    <path d=\"${path}\" fill=\"none\" stroke=\"var(--worker)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>${dots}\n    <text x=\"${P}\" y=\"${H - 2}\">${esc(first)}<\/text><text x=\"${W - P}\" y=\"${H - 2}\" text-anchor=\"end\">${esc(last)}<\/text><\/svg>`;\n}\nfunction renderTrends(tr, spec) {\n  const titles = Object.fromEntries((spec || []).map(m => [m.name, m]));\n  $(\"trends\").innerHTML = TREND_METRICS.map(name => {\n    const ser = tr.series[name] || [], last = ser[ser.length - 1];\n    const sp = titles[name] || {name, unit: \"\"};\n    return `<div class=\"panel trend\"><div class=\"label\"><span title=\"${esc(sp.formula || \"\")}\">${esc(sp.title || name)}<\/span><span class=\"mono\">${ser.length} wk<\/span><\/div>\n      <div class=\"val\">${fmtMetric(last)}<\/div>${spark(ser, sp.unit)}<\/div>`;\n  }).join(\"\");\n}\n\nfunction renderAlerts(list) {\n  const firing = (list || []).filter(a => a.status === \"firing\").length;\n  const navAl = $(\"nav-alerts\");\n  navAl.textContent = (list || []).length;\n  navAl.classList.toggle(\"warn\", firing > 0);\n  if (!list || !list.length) {\n    $(\"alerts\").innerHTML = `<div class=\"empty\">No alerts. Rules: <code>~/.claude/agent-dashboard/alerts.yaml<\/code>, evaluated by <code>orch-dashboard --tick<\/code>.<\/div>`;\n    return;\n  }\n  $(\"alerts\").innerHTML = `<table class=\"resp\"><thead><tr><th>Rule<\/th><th>Severity<\/th><th>Project<\/th><th>Task<\/th><th>Status<\/th><th>Last seen<\/th><th>Sent<\/th><\/tr><\/thead><tbody>\n    ${list.slice(0, 30).map(a => `<tr>\n      <td data-label=\"Rule\" class=\"mono\">${esc(a.rule_id)}<\/td>\n      <td data-label=\"Severity\"><span class=\"pill p-${a.severity === \"critical\" || a.severity === \"high\" ? \"stuck\" : \"BLOCKED\"}\">${esc(a.severity)}<\/span><\/td>\n      <td data-label=\"Project\" class=\"mono\">${esc(a.project || \"—\")}<\/td>\n      <td data-label=\"Task\" class=\"mono\">${esc(a.task_id || \"—\")}<\/td>\n      <td data-label=\"Status\">${esc(a.status)}${a.held ? \" (held)\" : \"\"}<\/td>\n      <td data-label=\"Last seen\" class=\"mono\">${new Date(a.last_seen * 1000).toLocaleString()}<\/td>\n      <td data-label=\"Sent\" class=\"num\">${a.send_count}<\/td>\n    <\/tr>`).join(\"\")}<\/tbody><\/table>`;\n}\n\nfunction renderAll(s, v, tr, alerts) {\n  LAST_DATA = { s, v, tr, alerts };\n  renderProgress(s); renderAgents(s); renderPerf(s); renderQuality(v); renderTrends(tr, SPEC);\n  renderTimeline(s); renderTasks(s); renderRuns(s); renderAlerts(alerts);\n}\n\n/* Task filter, search & trace expand handlers */\n$(\"task-filters\").addEventListener(\"click\", (e) => {\n  const btn = e.target.closest(\".f-btn\");\n  if (!btn) return;\n  TASK_FILTER = btn.dataset.filter;\n  document.querySelectorAll(\"#task-filters .f-btn\").forEach(b => b.classList.toggle(\"active\", b === btn));\n  if (LAST_DATA) renderTasks(LAST_DATA.s);\n});\n$(\"task-search\").addEventListener(\"input\", (e) => {\n  TASK_QUERY = e.target.value;\n  if (LAST_DATA) renderTasks(LAST_DATA.s);\n});\n$(\"tasks\").addEventListener(\"click\", async (e) => {\n  const copyBtn = e.target.closest(\".copy-btn\");\n  if (copyBtn) {\n    e.stopPropagation();\n    const text = copyBtn.dataset.copy || \"\";\n    try { await navigator.clipboard.writeText(text); copyBtn.textContent = \"Copied\"; } catch (_) { copyBtn.textContent = \"Select & copy\"; }\n    setTimeout(() => { copyBtn.textContent = \"Copy CLI\"; }, 1200);\n    return;\n  }\n  const row = e.target.closest(\"tr.task-row\");\n  if (!row) return;\n  const k = row.dataset.key;\n  if (EXPANDED_KEYS.has(k)) EXPANDED_KEYS.delete(k); else EXPANDED_KEYS.add(k);\n  if (LAST_DATA) renderTasks(LAST_DATA.s);\n});\n$(\"tasks\").addEventListener(\"keydown\", (e) => {\n  if (e.key !== \"Enter\" && e.key !== \" \") return;\n  const row = e.target.closest(\"tr.task-row\");\n  if (!row) return;\n  e.preventDefault();\n  row.click();\n});\n\nconst SNAP = window.__SNAPSHOT__ || null;\n\nfunction buildQuery(proj, win) {\n  const p = new URLSearchParams();\n  if (proj) p.set(\"project\", proj);\n  if (win) p.set(\"since\", win);\n  const qs = p.toString();\n  return qs ? \"?\" + qs : \"\";\n}\n\nasync function refresh() {\n  try {\n    const sel = $(\"project\");\n    const proj = sel.value;\n    const win = $(\"window\").value;\n    const q = buildQuery(proj, win);\n    const res = await fetch(\"/api/state\" + q, { cache: \"no-store\" });\n    const s = await res.json();\n    const cur = s.projects || [];\n    if (sel.options.length - 1 !== cur.length || [...sel.options].slice(1).some((o, i) => o.value !== cur[i])) {\n      const keep = sel.value;\n      sel.innerHTML = '<option value=\"\">All projects<\/option>' + cur.map(p => `<option value=\"${esc(p)}\">${esc(p)}<\/option>`).join(\"\");\n      sel.value = keep;\n    }\n    const qProj = proj ? \"?project=\" + encodeURIComponent(proj) : \"\";\n    const [v, tr, al, sp] = await Promise.all([\n      fetch(\"/api/v1/metrics\" + q, {cache: \"no-store\"}).then(r => r.json()),\n      fetch(\"/api/v1/trends\" + qProj, {cache: \"no-store\"}).then(r => r.json()),\n      fetch(\"/api/v1/alerts\", {cache: \"no-store\"}).then(r => r.json()),\n      SPEC ? Promise.resolve(null) : fetch(\"/api/v1/spec\").then(r => r.json())]);\n    if (sp) SPEC = sp.metrics;\n    renderAll(s, v, tr, al.alerts);\n    $(\"live\").classList.remove(\"stale\");\n    $(\"updated\").textContent = (PAUSED ? \"Paused\" : \"Live\") + \" · updated \" + new Date().toLocaleTimeString();\n    $(\"since\").textContent = s.sessions + \" session(s) since \" + new Date(s.since * 1000).toLocaleString();\n  } catch (e) {\n    $(\"live\").classList.add(\"stale\");\n    $(\"updated\").textContent = \"Server unreachable — retrying\";\n  }\n}\n\nlet resizeTimer = null;\nwindow.addEventListener(\"resize\", () => {\n  clearTimeout(resizeTimer);\n  resizeTimer = setTimeout(() => {\n    if (LAST_DATA) renderTimeline(LAST_DATA.s);\n  }, 150);\n});\n\nif (SNAP) {\n  SPEC = SNAP.spec;\n  $(\"mode-badge\").textContent = \"snapshot\";\n  $(\"project\").innerHTML = `<option>${esc(SNAP.project || \"All projects\")}<\/option>`;\n  $(\"project\").disabled = true;\n  $(\"window\").disabled = true;\n  $(\"pause-btn\").style.display = \"none\";\n  $(\"refresh-btn\").style.display = \"none\";\n  $(\"live\").classList.remove(\"live\");\n  renderAll(SNAP.state, SNAP.v1, SNAP.trends, SNAP.alerts || []);\n  $(\"updated\").textContent = \"Static snapshot · \" + new Date(SNAP.snapshot_at * 1000).toLocaleString();\n  $(\"since\").textContent = SNAP.state.sessions + \" session(s) since \" + new Date(SNAP.state.since * 1000).toLocaleString();\n} else {\n  const sp0 = new URLSearchParams(location.search);\n  const p0 = sp0.get(\"project\"), w0 = sp0.get(\"since\");\n  if (p0) { $(\"project\").innerHTML += `<option value=\"${esc(p0)}\">${esc(p0)}<\/option>`; $(\"project\").value = p0; }\n  if (w0 && [...$(\"window\").options].some(o => o.value === w0)) { $(\"window\").value = w0; }\n  refresh();\n  setInterval(() => { if (!PAUSED) refresh(); }, REFRESH_MS);\n  $(\"project\").addEventListener(\"change\", refresh);\n  $(\"window\").addEventListener(\"change\", refresh);\n  $(\"refresh-btn\").addEventListener(\"click\", refresh);\n  $(\"pause-btn\").addEventListener(\"click\", () => {\n    PAUSED = !PAUSED;\n    $(\"pause-btn\").textContent = PAUSED ? \"Resume\" : \"Pause\";\n    $(\"pause-btn\").classList.toggle(\"active\", PAUSED);\n    $(\"live\").classList.toggle(\"live\", !PAUSED);\n    $(\"live\").classList.toggle(\"paused\", PAUSED);\n    if (!PAUSED) refresh();\n  });\n}\n<\/script>\n<\/body>\n<\/html>\n";
const frameA = document.getElementById("frame-a");
const frameB = document.getElementById("frame-b");
frameA.srcdoc = MOCK_HTML;

const stage = document.getElementById("stage");
const devA = document.getElementById("dev-a");
const devB = document.getElementById("dev-b");
const capA = document.getElementById("cap-a");

function setMode(mode) {
  document.querySelectorAll(".vp-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  devB.classList.add("hide");
  devA.style.width = "100%";
  devA.style.flex = "1 1 auto";
  if (mode === "full") {
    stage.classList.remove("framed");
  } else if (mode === "desktop") {
    stage.classList.add("framed");
    devA.style.width = "1280px";
    devA.style.flex = "0 1 1280px";
    capA.textContent = "Desktop · 1280px";
  } else if (mode === "tablet") {
    stage.classList.add("framed");
    devA.style.width = "768px";
    devA.style.flex = "0 1 768px";
    capA.textContent = "Tablet · 768px";
  } else if (mode === "mobile") {
    stage.classList.add("framed");
    devA.style.width = "390px";
    devA.style.flex = "0 1 390px";
    capA.textContent = "Mobile · 390px";
  } else if (mode === "compare") {
    stage.classList.add("framed");
    devA.style.width = "920px";
    devA.style.flex = "1 1 600px";
    capA.textContent = "Desktop · Fluid";
    if (!frameB.srcdoc) frameB.srcdoc = MOCK_HTML;
    devB.classList.remove("hide");
  }
}

document.getElementById("vps").addEventListener("click", (e) => {
  const btn = e.target.closest(".vp-btn");
  if (btn) setMode(btn.dataset.mode);
});
</script>
